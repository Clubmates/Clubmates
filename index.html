<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUBMATES</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

       logo {
    width: 120px;
    max-width: 80%;
    margin-bottom: 10px;
} header h1 {
            font-size: 32px;
            letter-spacing: 3px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .inicio {
            text-align: center;
            padding: 70px 20px;
            background: white;
        }

        .inicio h2 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .inicio p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            background: #111;
            color: white;
            padding: 14px 25px;
            border-radius: 6px;
            text-decoration: none;
        }

        .productos {
            padding: 40px 20px;
            max-width: 1100px;
            margin: auto;
        }

        .productos h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .producto {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .producto .imagen {
            height: 220px;
            background: #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            color: #777;
        }

        .producto h3 {
            margin-bottom: 10px;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <img src="IMG-20260928-WA0031.jpg" alt="Logo CLUBMATES" class="logo">
    <h1>CLUBMATES</h1>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#contacto">Contacto</a>
    </nav>
</header>

<section class="inicio" id="inicio">
    <h2>Bienvenidos a CLUBMATES</h2>
    <p>Encontrá tus productos favoritos.</p>
    <a href="#productos" class="boton">Ver productos</a>
</section>

<section class="productos" id="productos">

    <h2>Nuestros productos</h2>

    <div class="catalogo">

        <div class="producto">
            <div class="imagen">
                FOTO DEL PRODUCTO
            </div>

            <h3>Producto 1</h3>
            <p class="precio">$0</p>

            <a href="#" class="boton">Comprar</a>
        </div>

        <div class="producto">
            <div class="imagen">
                FOTO DEL PRODUCTO
            </div>

            <h3>Producto 2</h3>
            <p class="precio">$0</p>

            <a href="#" class="boton">Comprar</a>
        </div>

        <div class="producto">
            <div class="imagen">
                FOTO DEL PRODUCTO
            </div>

            <h3>Producto 3</h3>
            <p class="precio">$0</p>

            <a href="#" class="boton">Comprar</a>
        </div>

    </div>

</section>

<footer id="contacto">
    <p>© 2026 CLUBMATES</p>
</footer>

</body>
</html>
